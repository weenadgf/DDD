<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR Frog</title>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    .ui-container {
      position: absolute;
      bottom: 30px;
      width: 100%;
      display: flex;
      justify-content: center;
      z-index: 10;
    }
    button {
      padding: 12px 24px;
      font-size: 18px;
      cursor: pointer;
      font-weight: bold;
      background-color: #4CAF50;
      color: white;
      border: 2px solid #2E7D32;
      border-radius: 8px;
    }
  </style>
</head>
<body style="margin: 0; overflow: hidden;">

  <div class="ui-container">
    <button id="btn-jump">กระโดด</button>
  </div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    <a-marker preset="hiro">
      
      <!-- ตัวกบ -->
      <a-entity id="frog" position="0 0 0" rotation="0 0 0">
        <!-- ลำตัว -->
        <a-sphere color="#4CAF50" radius="0.5" scale="1 0.6 1" position="0 0.3 0"></a-sphere>
        
        <!-- ตาซ้าย -->
        <a-sphere color="white" radius="0.15" position="0.25 0.6 0.3"></a-sphere>
        <a-sphere color="black" radius="0.05" position="0.3 0.65 0.38"></a-sphere>
        
        <!-- ตาขวา -->
        <a-sphere color="white" radius="0.15" position="-0.25 0.6 0.3"></a-sphere>
        <a-sphere color="black" radius="0.05" position="-0.3 0.65 0.38"></a-sphere>
        
        <!-- ขา -->
        <a-sphere color="#388E3C" radius="0.15" position="0.4 0.15 0.3"></a-sphere>
        <a-sphere color="#388E3C" radius="0.15" position="-0.4 0.15 0.3"></a-sphere>
        <a-sphere color="#388E3C" radius="0.15" position="0.4 0.15 -0.3"></a-sphere>
        <a-sphere color="#388E3C" radius="0.15" position="-0.4 0.15 -0.3"></a-sphere>
      </a-entity>

    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const frog = document.querySelector('#frog');
    const btn = document.querySelector('#btn-jump');
    let isJumping = false;

    btn.addEventListener('click', () => {
      // ป้องกันการกดซ้ำขณะกบกำลังกระโดด
      if (isJumping) return;
      isJumping = true;

      let currentRot = frog.getAttribute('rotation');
      let targetRotY = currentRot.y + 90; // หมุนทีละ 90 องศา

      // สั่งกระโดดขึ้น
      frog.setAttribute('animation__jumpUp', 'property: position; to: 0 1.5 0; dur: 250; easing: easeOutQuad');
      // สั่งหมุนตัว
      frog.setAttribute('animation__spin', `property: rotation; to: 0 ${targetRotY} 0; dur: 500; easing: linear`);

      // หลังจาก 250ms สั่งตกลงมา
      setTimeout(() => {
        frog.setAttribute('animation__jumpDown', 'property: position; to: 0 0 0; dur: 250; easing: easeInQuad');
      }, 250);

      // เคลียร์แอนิเมชันและเปิดให้กดใหม่ได้เมื่อจบรอบ
      setTimeout(() => {
        frog.removeAttribute('animation__jumpUp');
        frog.removeAttribute('animation__jumpDown');
        frog.removeAttribute('animation__spin');
        frog.setAttribute('rotation', `0 ${targetRotY} 0`);
        isJumping = false;
      }, 500);
    });
  </script>

</body>
</html>
